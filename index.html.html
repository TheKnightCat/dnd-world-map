<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Атлас Мира — Интерактивная карта</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');

  :root {
    --ink: #0a0e16;
    --parchment: #d6c8a0;
    --parchment-dark: #a89878;
    --gold: #c8aa6e;          /* Hextech gold */
    --gold-bright: #f0e6d2;   /* почти белое золото */
    --gold-deep: #785a28;
    --cyan: #0ac8b9;          /* акцент Hextech cyan */
    --cyan-dark: #0a5c63;
    --crimson: #c8412f;
    --bg-deep: #010a13;       /* почти чёрный сине-зелёный */
    --bg: #0a1428;
    --panel: #0a1016;
    --panel-edge: #463714;    /* тёмно-золотая кромка */
    --panel-edge-bright: #785a28;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'EB Garamond', serif;
    background: var(--bg-deep);
    color: var(--parchment);
    user-select: none;
  }

  /* ---- Layout ---- */
  #app { position: fixed; inset: 0; display: flex; }
  #canvas-wrap { position: relative; flex: 1; cursor: grab; overflow: hidden; background: var(--bg-deep); }
  #canvas-wrap.dragging { cursor: grabbing; }
  canvas { position: absolute; top: 0; left: 0; }

  /* виньетка поверх карты — затемнение к краям для иммерсии */
  #vignette {
    position: absolute; inset: 0; z-index: 8; pointer-events: none;
    background:
      radial-gradient(ellipse 75% 75% at 50% 48%, transparent 55%, rgba(1,10,19,.55) 88%, rgba(1,10,19,.92) 100%);
    mix-blend-mode: multiply;
  }
  /* тонкая золотая «рамка кадра» как в интерфейсе LoL */
  #frame {
    position: absolute; inset: 10px; z-index: 9; pointer-events: none;
    border: 1px solid rgba(120,90,40,.35);
    box-shadow: inset 0 0 0 1px rgba(10,200,185,.04);
  }
  #frame::before, #frame::after {
    content:''; position:absolute; width:26px; height:26px; border:2px solid rgba(200,170,110,.5);
  }
  #frame::before { top:-2px; left:-2px; border-right:none; border-bottom:none; }
  #frame::after  { bottom:-2px; right:-2px; border-left:none; border-top:none; }

  /* ---- Top bar ---- */
  #topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; gap: 16px;
    padding: 18px 28px;
    background: linear-gradient(180deg, rgba(1,10,19,.9), rgba(1,10,19,.4) 70%, transparent);
    pointer-events: none;
  }
  #topbar > * { pointer-events: auto; }
  .title {
    font-family: 'Cinzel', serif; font-weight: 700; font-size: 24px;
    letter-spacing: 4px; color: var(--gold-bright); text-transform: uppercase;
    text-shadow: 0 0 22px rgba(200,170,110,.5);
    cursor: pointer; border-bottom: 1px solid transparent; transition: all .2s;
    max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .title:hover { color: #fff; border-bottom-color: var(--cyan); text-shadow: 0 0 22px rgba(10,200,185,.6); }
  #title-input {
    font-family: 'Cinzel', serif; font-weight: 700; font-size: 24px; letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold-bright); background: rgba(1,10,19,.95); border: 1px solid var(--gold);
    border-radius: 2px; padding: 2px 10px; outline: none; width: 400px;
  }
  .crumb {
    font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--parchment-dark);
    display: flex; align-items: center; gap: 8px;
  }
  .crumb::before { content:''; width: 16px; height: 1px; background: var(--gold-deep); }
  .crumb b { color: var(--gold); font-weight: 500; }
  #search {
    margin-left: auto;
    background: rgba(1,10,19,.7); border: 1px solid var(--panel-edge);
    color: var(--parchment); font-family: inherit; font-size: 15px;
    padding: 8px 14px; border-radius: 2px; width: 210px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  #search:focus { border-color: var(--cyan); box-shadow: 0 0 12px rgba(10,200,185,.25); }
  #search::placeholder { color: #8a7a5e; }

  /* ---- Filter button + dropdown ---- */
  #filter-btn {
    display: flex; align-items: center; gap: 8px;
    font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    background: rgba(1,10,19,.7); border: 1px solid var(--panel-edge);
    color: var(--parchment); padding: 8px 16px; border-radius: 2px;
    cursor: pointer; transition: all .2s;
  }
  #filter-btn:hover { border-color: var(--cyan); color: var(--gold-bright); }
  #filter-btn.has-active { border-color: var(--gold); color: var(--gold); }
  #filter-btn svg { width: 16px; height: 16px; }
  #filter-btn .count {
    font-size: 11px; background: var(--gold); color: #010a13;
    border-radius: 9px; padding: 1px 7px; font-weight: 700;
  }

  #filter-menu {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 45;
    width: 320px; max-width: 88vw; background: var(--panel);
    border-right: 1px solid var(--panel-edge-bright);
    box-shadow: 20px 0 60px rgba(0,0,0,.7);
    display: flex; flex-direction: column;
    transition: transform .4s cubic-bezier(.22,1,.36,1), opacity .3s;
    overflow: hidden;
  }
  #filter-menu::after { /* золотая светящаяся кромка справа */
    content:''; position:absolute; right:0; top:0; bottom:0; width:2px;
    background: linear-gradient(180deg, transparent, var(--gold) 30%, var(--gold) 70%, transparent);
    box-shadow: 0 0 14px rgba(200,170,110,.5);
  }
  #filter-menu.hidden { transform: translateX(-102%); opacity: 0; pointer-events: none; }
  .fm-head {
    padding: 18px 18px 14px; border-bottom: 1px solid var(--panel-edge-bright);
    display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    background: linear-gradient(180deg, #0d1a2a, #0a1016);
  }
  .fm-head span.fm-title {
    font-family: 'Cinzel', serif; font-size: 16px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--gold-bright);
  }
  .fm-close {
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color: var(--gold-bright); font-size: 16px; background: rgba(1,10,19,.6);
    border: 1px solid var(--panel-edge-bright); transition: all .2s;
  }
  .fm-close:hover { color:#fff; border-color: var(--cyan); box-shadow: 0 0 10px rgba(10,200,185,.4); }
  .fm-toggle-all {
    font-family:'Cinzel',serif; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--gold); cursor: pointer;
    border: 1px solid var(--panel-edge-bright); border-radius: 2px; padding: 5px 12px;
    transition: all .15s; margin: 12px 18px; flex-shrink: 0; text-align: center;
  }
  .fm-toggle-all:hover { border-color: var(--gold-bright); color: var(--parchment); }
  .fm-row {
    display: flex; align-items: center; gap: 11px;
    padding: 11px 18px; cursor: pointer; transition: background .12s;
    border-bottom: 1px solid rgba(58,46,31,.4);
  }
  .fm-row:last-child { border-bottom: none; }
  .fm-row:hover { background: #12202f; }
  .fm-icon {
    width: 28px; height: 28px; flex-shrink: 0; display: flex;
    align-items: center; justify-content: center;
    border-radius: 50%; background: rgba(1,10,19,.7);
    border: 1.5px solid currentColor;
  }
  .fm-icon svg { width: 16px; height: 16px; }
  .fm-label { flex: 1; font-size: 15px; color: var(--parchment); }
  .fm-check {
    width: 19px; height: 19px; border-radius: 4px; flex-shrink: 0;
    border: 1.5px solid var(--panel-edge); position: relative; transition: all .12s;
  }
  .fm-row.on .fm-check { background: var(--gold); border-color: var(--gold); }
  .fm-row.on .fm-check::after {
    content: '✓'; position: absolute; inset: 0; text-align: center;
    line-height: 17px; color: #1c1712; font-size: 13px; font-weight: 700;
  }
  .fm-row.off .fm-label, .fm-row.off .fm-icon { opacity: .4; }
  .fm-back {
    padding: 11px 16px; cursor: pointer; font-family: 'Cinzel', serif;
    font-size: 12px; letter-spacing: 1px; color: var(--gold);
    border-bottom: 1px solid var(--panel-edge); transition: background .12s;
  }
  .fm-back:hover { background: #251d14; }

  /* группы-аккордеон фильтров */
  .fm-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .fm-group { border-bottom: 1px solid rgba(70,55,20,.4); }
  .fm-gh {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 14px 18px; font-family:'Cinzel',serif; font-size: 13px; letter-spacing: 1px;
    text-transform: uppercase; color: var(--parchment); transition: background .12s;
  }
  .fm-gh:hover { background: #12202f; }
  .fm-gh > span:first-child { flex: 1; }
  .fm-gcount { background: var(--gold); color:#010a13; border-radius:9px; padding:0 7px; font-size:11px; font-weight:700; }
  .fm-arrow { color: var(--gold); font-size: 11px; }
  .fm-glist { background: rgba(1,10,19,.4); padding: 2px 0 6px; }
  .fm-glist .fm-row { padding: 9px 18px; border-bottom: none; }
  .fm-empty { padding: 10px 18px; font-size: 13px; font-style: italic; color: var(--parchment-dark); }
  /* кастомный скроллбар */
  .fm-scroll::-webkit-scrollbar { width: 8px; }
  .fm-scroll::-webkit-scrollbar-thumb { background: var(--panel-edge-bright); border-radius: 4px; }
  .fm-scroll::-webkit-scrollbar-track { background: transparent; }

  /* ---- Side panel (стиль карточки региона LoL) ---- */
  #panel {
    width: 400px; flex-shrink: 0; background: var(--panel);
    border-left: 1px solid var(--panel-edge-bright);
    display: flex; flex-direction: column;
    box-shadow: -20px 0 60px rgba(0,0,0,.7);
    transition: transform .45s cubic-bezier(.22,1,.36,1), opacity .35s;
    position: relative;
  }
  #panel::before { /* золотая светящаяся кромка слева */
    content:''; position:absolute; left:0; top:0; bottom:0; width:2px;
    background: linear-gradient(180deg, transparent, var(--gold) 30%, var(--gold) 70%, transparent);
    box-shadow: 0 0 14px rgba(200,170,110,.5);
  }
  #panel.closed { transform: translateX(402px); opacity: 0; pointer-events: none; }
  .panel-hero {
    position: relative; height: 168px; flex-shrink: 0; overflow: hidden;
    background: linear-gradient(135deg, #0a1a2a, #050d16);
    border-bottom: 1px solid var(--panel-edge-bright);
  }
  .panel-hero img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .85; }
  .panel-hero .hero-fade {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 30%, rgba(10,16,22,.4) 70%, var(--panel) 100%);
  }
  .panel-hero.empty {
    display: flex; align-items: center; justify-content: center;
    color: var(--gold-deep); font-family: 'Cinzel', serif; font-size: 40px; letter-spacing: 4px;
  }
  .panel-head {
    padding: 16px 26px 14px; position: relative;
    margin-top: -44px; z-index: 2;
  }
  #panel-close {
    position: absolute; top: 14px; right: 14px; z-index: 10;
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--gold-bright); font-size: 18px; line-height: 1;
    background: rgba(1,10,19,.7); border: 1px solid var(--panel-edge-bright); transition: all .2s;
  }
  #panel-close:hover { color: #fff; border-color: var(--cyan); box-shadow: 0 0 12px rgba(10,200,185,.4); }
  .panel-type {
    font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 2.5px;
    text-transform: uppercase; color: var(--cyan); margin-bottom: 6px;
    display: flex; align-items: center; gap: 8px;
  }
  .panel-type .dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
  .panel-name {
    font-family: 'Cinzel', serif; font-size: 28px; font-weight: 700;
    color: var(--gold-bright); line-height: 1.05;
    text-shadow: 0 2px 12px rgba(0,0,0,.6);
  }
  .panel-name::after {
    content:''; display:block; width:44px; height:2px; margin-top:10px;
    background: linear-gradient(90deg, var(--gold), transparent);
  }
  .panel-body { padding: 8px 26px 16px; overflow-y: auto; flex: 1; }
  .panel-body p { font-size: 16px; line-height: 1.6; color: var(--parchment); margin-bottom: 14px; }
  .panel-body textarea, .panel-body input.edit, .panel-body select {
    width: 100%; background: var(--bg-deep); border: 1px solid var(--panel-edge);
    color: var(--parchment); font-family: inherit; font-size: 15px;
    padding: 9px; border-radius: 2px; margin-bottom: 10px; outline: none; transition: border-color .2s;
  }
  .panel-body textarea:focus, .panel-body input.edit:focus, .panel-body select:focus { border-color: var(--cyan); }
  .panel-body textarea { min-height: 110px; resize: vertical; }
  .panel-body label { font-family:'Cinzel',serif; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--cyan); display: block; margin-bottom: 5px; }
  .field { margin-bottom: 14px; }
  .map-preview {
    width: 100%; border-radius: 2px; overflow: hidden; margin-bottom: 16px;
    border: 1px solid var(--panel-edge); background: var(--bg-deep);
  }
  .map-preview img { width: 100%; display: block; }
  .map-preview.empty {
    padding: 24px 14px; text-align: center; font-size: 13px; font-style: italic;
    color: var(--parchment-dark); line-height: 1.5;
  }
  .panel-foot { padding: 16px 26px; border-top: 1px solid var(--panel-edge); display: flex; gap: 10px; }

  .btn {
    font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase;
    padding: 11px 14px; border-radius: 2px; cursor: pointer; border: 1px solid var(--panel-edge-bright);
    background: transparent; color: var(--gold); transition: all .2s; flex: 1; text-align: center;
  }
  .btn:hover { border-color: var(--gold-bright); color: var(--gold-bright); box-shadow: inset 0 0 12px rgba(200,170,110,.12); }
  .btn.gold {
    background: linear-gradient(180deg, #c8aa6e, #a07d3a); color: #010a13; border-color: var(--gold-bright); font-weight: 700;
  }
  .btn.gold:hover { background: linear-gradient(180deg, #e4c88f, #c8aa6e); box-shadow: 0 0 16px rgba(200,170,110,.4); }
  .btn.danger { color: var(--crimson); border-color: rgba(200,65,47,.5); }
  .btn.party-on { color:#1c1712; background: linear-gradient(180deg,#f7d774,#e0b94e); border-color:#f7d774; box-shadow:0 0 14px rgba(240,199,94,.45); }
  .btn.danger:hover { border-color: var(--crimson); color: #ff7a68; box-shadow: inset 0 0 12px rgba(200,65,47,.15); }

  /* ---- Floating controls ---- */
  #controls {
    position: absolute; bottom: 26px; left: 26px; z-index: 20;
    display: flex; flex-direction: column; gap: 8px;
  }
  .ctrl {
    width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
    background: rgba(1,10,19,.75); border: 1px solid var(--panel-edge-bright);
    color: var(--gold); font-size: 20px; display: flex; align-items: center; justify-content: center;
    font-family: 'Cinzel', serif; transition: all .2s; backdrop-filter: blur(2px);
  }
  .ctrl:hover { border-color: var(--cyan); color: var(--gold-bright); box-shadow: 0 0 14px rgba(10,200,185,.35); transform: translateY(-1px); }
  .ctrl.active { background: linear-gradient(180deg, var(--gold), var(--gold-deep)); color: #010a13; border-color: var(--gold-bright); }
  #goparty { color:#f7d774; border-color:rgba(247,215,116,.55); }
  #goparty:hover { background:linear-gradient(180deg,#f7d774,#e0b94e); color:#1c1712; box-shadow:0 0 14px rgba(240,199,94,.5); }

  #hint {
    position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
    z-index: 15; font-family:'Cinzel',serif; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--parchment-dark);
    background: rgba(1,10,19,.7); padding: 8px 18px; border-radius: 2px;
    border: 1px solid var(--panel-edge); pointer-events: none; transition: opacity .4s;
    backdrop-filter: blur(2px);
  }

  .badge { display:inline-block; font-family:'Cinzel',serif; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--cyan); border:1px solid var(--cyan-dark); border-radius:2px; padding:3px 9px; margin-bottom:12px;}

  /* блок атрибутов локации */
  .attrs { margin-bottom: 16px; }
  .attr {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid rgba(70,55,20,.4);
  }
  .attr:last-child { border-bottom: none; }
  .attr-ico {
    width: 22px; height: 22px; flex-shrink: 0; color: var(--gold); margin-top: 1px;
  }
  .attr-ico svg { width: 100%; height: 100%; }
  .attr-text { flex: 1; }
  .attr-label {
    font-family:'Cinzel',serif; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--cyan); margin-bottom: 2px;
  }
  .attr-val { font-size: 15px; color: var(--parchment); line-height: 1.35; }
  .attr-val .chip-r {
    display:inline-block; background:rgba(10,200,185,.1); border:1px solid var(--cyan-dark);
    border-radius:2px; padding:1px 8px; margin:2px 4px 2px 0; font-size:13px; color:var(--gold-bright);
  }
  /* сводка вложенных локаций */
  .sub-list { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:6px; }
  .sub-chip {
    display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--parchment);
    background:rgba(1,10,19,.5); border:1px solid var(--panel-edge); border-radius:3px; padding:4px 9px;
  }
  .sub-ico { width:15px; height:15px; display:inline-flex; }
  .sub-ico svg { width:100%; height:100%; }
  /* поля ввода нескольких рас */
  .races-edit { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  .race-tag {
    display:flex; align-items:center; gap:5px; background:var(--bg-deep);
    border:1px solid var(--panel-edge); border-radius:2px; padding:4px 8px; font-size:13px;
  }
  .race-tag b { cursor:pointer; color:var(--crimson); font-size:15px; line-height:1; }
  .race-add { display:flex; gap:6px; }
  .race-add input { margin-bottom:0 !important; }
  .race-add button {
    flex-shrink:0; background:var(--bg-deep); border:1px solid var(--panel-edge-bright);
    color:var(--gold); border-radius:2px; padding:0 12px; cursor:pointer; font-size:18px;
  }

  /* свечение пульсации для подсветки выбранной точки делается на canvas */

  /* ============ Мобильная адаптация ============ */
  @media (max-width: 760px) {
    /* панель остаётся боковой, но overlay поверх карты (не отжимает её) */
    #panel {
      position: absolute; top: 0; right: 0; bottom: 0; left: auto;
      width: 86vw; max-width: 360px; z-index: 40;
      transition: transform .4s cubic-bezier(.22,1,.36,1), opacity .3s;
    }
    #panel.closed { transform: translateX(102%); opacity: 0; }
    .panel-hero { height: 140px; }
    #panel-close { top: 12px; right: 12px; }

    /* топбар компактнее */
    #topbar { padding: 12px 14px; gap: 10px; flex-wrap: wrap; }
    .title { font-size: 19px; letter-spacing: 2px; }
    #search { width: 130px; padding: 6px 10px; font-size: 14px; }
    #filter-btn span:not(.count) { display: none; } /* оставляем только иконку */
    #filter-btn { padding: 8px 10px; }

    /* кнопки управления — внизу слева, вертикально */
    #controls { flex-direction: column; bottom: 18px; top: auto; left: 14px; }
    .ctrl { width: 42px; height: 42px; font-size: 18px; }

    #hint { display: none; }
    #frame { inset: 5px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="canvas-wrap">
    <canvas id="map"></canvas>
    <div id="vignette"></div>
    <div id="frame"></div>

    <div id="topbar">
      <span class="title" id="world-title" title="Нажмите, чтобы переименовать мир">ATLAS</span>
      <span class="crumb" id="crumb" style="display:none"></span>
      <span id="back-world" title="На уровень выше" style="display:none; cursor:pointer; font-family:'Cinzel',serif; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold); border:1px solid var(--panel-edge-bright); border-radius:2px; padding:6px 12px;">‹ Назад</span>
      <input id="search" placeholder="Поиск локаций…" autocomplete="off">
      <div id="filter-btn" title="Фильтры">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
        <span>Фильтры</span>
        <span class="count" id="filter-count"></span>
      </div>
    </div>

    <div id="filter-menu" class="hidden"></div>

    <div id="controls">
      <div class="ctrl" id="zoomin" title="Приблизить">+</div>
      <div class="ctrl" id="zoomout" title="Отдалить">–</div>

/* ---------- Процедурный фон карты ---------- */
// детерминированный шум на основе seed
function makeNoise(seed){
  let s = seed>>>0;
  const rnd = ()=>{ s = (s*1664525+1013904223)>>>0; return s/4294967296; };
  const N=64, grid=[];
  for(let i=0;i<N*N;i++) grid.push(rnd());
  return (x,y)=>{ // bilinear-ish
    const gx=x*(N-1), gy=y*(N-1);
    const x0=Math.floor(gx), y0=Math.floor(gy);
    const fx=gx-x0, fy=gy-y0;
    const a=grid[(y0%N)*N+(x0%N)], b=grid[(y0%N)*N+((x0+1)%N)];
    const c=grid[((y0+1)%N)*N+(x0%N)], d=grid[((y0+1)%N)*N+((x0+1)%N)];
    const sx=fx*fx*(3-2*fx), sy=fy*fy*(3-2*fy);
    return (a*(1-sx)+b*sx)*(1-sy)+(c*(1-sx)+d*sx)*sy;
  };
}
let bgCache = {};   // кэш отрисованного фона по ключу карты+seed
function buildBackground(key, seed){
  if (bgCache[key]) return bgCache[key];
  const SZ = 1600;
  const off = document.createElement('canvas');
  off.width=SZ; off.height=SZ;
  const c = off.getContext('2d');
  const n1=makeNoise(seed), n2=makeNoise(seed*7+13), n3=makeNoise(seed*31+5);
  const img=c.createImageData(SZ,SZ), d=img.data;
  for(let py=0;py<SZ;py++){
    for(let px=0;px<SZ;px++){
      const u=px/SZ, v=py/SZ;
      // высота: несколько октав + радиальный спад к краям (остров/материк)
      let h = n1(u*3,v*3)*0.6 + n2(u*7,v*7)*0.3 + n3(u*15,v*15)*0.1;
      const dx=u-0.5, dy=v-0.5; const dist=Math.sqrt(dx*dx+dy*dy)*1.9;
      h = h - dist*0.55 + 0.15;
      let r,g,b;
      if (h<0.18){ r=8;g=22;b=38; }             // глубокое море (тёмно-синее)
      else if (h<0.30){ r=18;g=46;b=68; }       // мелководье
      else if (h<0.34){ r=120;g=110;b=78; }     // берег
      else if (h<0.55){ r=58;g=72;b=58; }        // равнины (приглушённый хвойный)
      else if (h<0.72){ r=44;g=58;b=50; }        // леса
      else if (h<0.85){ r=78;g=72;b=58; }        // холмы
      else { r=120;g=116;b=110; }                // горы (холодный камень)
      // лёгкое затемнение для текстуры
      const t = n3(u*40,v*40)*0.14-0.07;
      r=Math.max(0,Math.min(255,r+(r*t)));
      g=Math.max(0,Math.min(255,g+(g*t)));
      b=Math.max(0,Math.min(255,b+(b*t)));
      const i=(py*SZ+px)*4; d[i]=r; d[i+1]=g; d[i+2]=b; d[i+3]=255;
    }
  }
  c.putImageData(img,0,0);
  // тёмный сине-чёрный оверлей по краям
  const grd=c.createRadialGradient(SZ/2,SZ/2,SZ*0.22,SZ/2,SZ/2,SZ*0.72);
  grd.addColorStop(0,'rgba(0,0,0,0)');
  grd.addColorStop(1,'rgba(1,10,19,0.7)');
  c.fillStyle=grd; c.fillRect(0,0,SZ,SZ);
  bgCache[key]=off; return off;
}

/* ---------- Размеры ---------- */
function resize(){
  W = wrap.clientWidth; H = wrap.clientHeight;
  if(!W || !H) return;   // защита от нулевых размеров на раннем рендере
  cvs.width=Math.round(W*DPR); cvs.height=Math.round(H*DPR);
  cvs.style.width=W+'px'; cvs.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(typeof refreshAspect==='function') refreshAspect();
  if(typeof clampView==='function') clampView();
  draw();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>{ setTimeout(resize, 250); });
if(window.visualViewport){ window.visualViewport.addEventListener('resize', resize); }

/* ---------- Координаты: карта(0..1 x0..1) <-> экран ----------
   Карта — прямоугольник с собственным соотношением сторон (mapAspect = ширина/высота).
   Базовый размер подбирается так, чтобы карта заполняла экран целиком (cover).
   view.scale/x/y задают дополнительный зум и свободное смещение. */
let mapAspect = 1;   // соотношение сторон текущей карты (ш/в)

// Базовый прямоугольник карты при scale=1 (cover экрана), без учёта view-смещения
function baseRect(){
  let bw, bh;
  if (W/H > mapAspect){ bw = W; bh = W/mapAspect; }   // ограничено по ширине
  else { bh = H; bw = H*mapAspect; }                  // ограничено по высоте
  return { w:bw, h:bh };
}
function mapRect(){
  const b = baseRect();
  const w = b.w*view.scale, h = b.h*view.scale;
  const ox = (W - w)/2 + view.x;
  const oy = (H - h)/2 + view.y;
  return { ox, oy, w, h };
}
function toScreen(lx,ly){
  const r = mapRect();
  return [ r.ox + lx*r.w, r.oy + ly*r.h ];
}
function toWorld(sx,sy){
  const r = mapRect();
  return [ (sx-r.ox)/r.w, (sy-r.oy)/r.h ];
}

// Пересчёт соотношения сторон при смене карты (картинка → её аспект, иначе аспект экрана)
function refreshAspect(){
  const url = DATA.images[currentMap];
  if(url){
    const img = getUserImage(currentMap);
    if(img && img.complete && img.naturalWidth){ mapAspect = img.naturalWidth/img.naturalHeight; }
    else { mapAspect = W/H; }   // до загрузки используем экран, потом onload перерисует
  } else {
    mapAspect = W/H;           // заглушка заполняет весь экран
  }
}

/* ---------- Иконки маркеров ---------- */
// Кэш растеризованных иконок: icon+color -> HTMLImageElement
const iconImgCache = {};
function getIconImage(icon, color){
  const key=icon+'|'+color;
  if(iconImgCache[key]) return iconImgCache[key];
  const inner = typeSVGPath(icon).replace(/currentColor/g, color);
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48">'+inner+'</svg>';
  const img = new Image();
  img.onload=()=>draw();
  img.src = 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
  iconImgCache[key]=img;
  return img;
}
function drawIcon(x,y,type,r,glow,loc){
  const t = TYPES[type]||TYPES.village;
  ctx.save();
  if(glow){ ctx.shadowColor=t.color; ctx.shadowBlur=22; }
  ctx.translate(x,y);
  // подложка-медальон
  ctx.beginPath(); ctx.arc(0,0,r,0,7);
  ctx.fillStyle='rgba(1,10,19,.9)'; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle=glow?'#f0e6d2':t.color; ctx.stroke();
  ctx.shadowBlur=0;
  // кастомная SVG-иконка региона, если загружена
  let img;
  if(loc && loc.iconSvg){
    const ck='custom|'+loc.id;
    if(iconImgCache[ck] && iconImgCache[ck].src===loc.iconSvg) img=iconImgCache[ck];
    else { img=new Image(); img.onload=()=>draw(); img.src=loc.iconSvg; iconImgCache[ck]=img; }
  } else {
    img=getIconImage(t.icon, t.color);
  }
  if(img && img.complete && img.naturalWidth){
    const s=r*1.35; ctx.drawImage(img, -s/2, -s/2, s, s);
  } else {
    ctx.fillStyle=t.color; ctx.beginPath(); ctx.arc(0,0,r*0.4,0,7); ctx.fill();
  }
  ctx.restore();
}

/* ---------- Главная отрисовка ---------- */
function draw(){
  ctx.clearRect(0,0,W,H);
  // глубокий фон под картой
  ctx.fillStyle='#010a13'; ctx.fillRect(0,0,W,H);

  const m = curr();
  const rect = mapRect();
  const ox=rect.ox, oy=rect.oy, w=rect.w, h=rect.h;
  ctx.save();
  ctx.beginPath(); ctx.rect(ox,oy,w,h); ctx.clip();
  const userImg = getUserImage(currentMap);
  if(userImg && userImg.complete && userImg.naturalWidth){
    // картинка заполняет всю область карты (аспект области = аспекту картинки)
    ctx.drawImage(userImg, ox,oy,w,h);
  } else {
    const seed = currentMap==='world' ? DATA.world.seed : (hashStr(currentMap)>>>0);
    const bg = buildBackground(currentMap, seed);
    ctx.drawImage(bg, ox,oy,w,h);
  }
  ctx.restore();
  // рамка карты — тонкая золотая
  ctx.strokeStyle='rgba(120,90,40,.5)'; ctx.lineWidth=2; ctx.strokeRect(ox,oy,w,h);

  // маркеры
  const baseR = Math.max(10, 12*Math.min(view.scale,2.2));
  m.locations.forEach(l=>{
    if(!passFilter(l)) return;
    const found = searchQ && l.name.toLowerCase().includes(searchQ);
    const dim = searchQ && !found;
    const isSel = selected===l.id;
    const isHover = hoverId===l.id;
    const active2 = isSel || found;
    const [x,y]=toScreen(l.x,l.y);
    const r = baseR * (isSel?1.25 : isHover?1.12 : 1);
    ctx.globalAlpha = dim?0.22:1;

    // пульсирующее кольцо вокруг активной/hover точки
    if(active2 || isHover){
      const t = TYPES[l.type]||TYPES.village;
      const pulse = active2 ? (0.5+0.5*Math.sin(glowPhase)) : 0.4;
      ctx.save();
      ctx.beginPath(); ctx.arc(x,y, r+6+pulse*5, 0, 7);
      ctx.strokeStyle = hexA(t.color, 0.25+pulse*0.45); ctx.lineWidth=2; ctx.stroke();
      if(active2){ ctx.beginPath(); ctx.arc(x,y, r+12+pulse*8, 0, 7);
        ctx.strokeStyle = hexA(t.color, 0.12+pulse*0.18); ctx.lineWidth=1.5; ctx.stroke(); }
      ctx.restore();
    }
    drawIcon(x,y,l.type,r, active2||isHover, l);
    if(isPartyHere(l.id)) drawPartyStar(x, y-r-8, r);

    const showLabel = active2 || isHover || view.scale>1.4;
    if(showLabel){
      ctx.globalAlpha = dim?0.22:1;
      ctx.font='600 13px "Cinzel", serif'; ctx.textAlign='center';
      ctx.lineWidth=4; ctx.strokeStyle='rgba(1,10,19,.92)';
      ctx.strokeText(l.name, x, y+r+17);
      ctx.fillStyle = active2?'#f0e6d2': isHover?'#e8dcc0':'#c8aa6e';
      ctx.fillText(l.name, x, y+r+17);
    }
    ctx.globalAlpha=1;
  });
}
function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h; }

/* ---------- Метка партии ---------- */
// Совпадает ли путь партии с текущей картой (navStack)
function partyOnCurrentMap(){
  if(!DATA.party) return false;
  const p=DATA.party.path||[];
  if(p.length!==navStack.length) return false;
  return p.every((id,i)=>id===navStack[i]);
}
function isPartyHere(locId){ return partyOnCurrentMap() && DATA.party.id===locId; }
// Нарисовать золотую звезду партии над точкой
function drawPartyStar(cx, cy, r){
  const R=Math.max(7, r*0.55), ph=glowPhase;
  ctx.save();
  ctx.translate(cx, cy);
  // мягкое свечение
  ctx.shadowColor='#f0c75e'; ctx.shadowBlur=12+4*Math.sin(ph);
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const a=-Math.PI/2 + i*2*Math.PI/5, a2=a+Math.PI/5;
    ctx.lineTo(Math.cos(a)*R, Math.sin(a)*R);
    ctx.lineTo(Math.cos(a2)*R*0.45, Math.sin(a2)*R*0.45);
  }
  ctx.closePath();
  ctx.fillStyle='#f7d774'; ctx.fill();
  ctx.lineWidth=1.5; ctx.strokeStyle='#fff4d0'; ctx.stroke();
  ctx.restore();
}

/* Проходит ли локация активные фильтры. Пустой набор = критерий не применяется. */
function passFilter(l){
  if(filters.types && filters.types.size && !filters.types.has(l.type)) return false;
  // по полям: для multi — пересечение, для простых — точное совпадение
  for(const key in filters){
    if(key==='types') continue;
    const set=filters[key]; if(!set || !set.size) continue;
    const schema=fieldsFor(l.type).find(f=>f.key===key);
    if(schema && schema.multi){
      const arr=Array.isArray(l[key])?l[key]:[];
      if(!arr.some(v=>set.has(v))) return false;
    } else {
      if(!set.has((l[key]||'').trim())) return false;
    }
  }
  return true;
}
function anyFilter(){ let n=0; for(const k in filters) n+=filters[k].size; return n>0; }

/* ---------- Хит-тест ---------- */
function pick(sx,sy){
  const m=curr(); const r=Math.max(13,15*Math.min(view.scale,2));
  for(let i=m.locations.length-1;i>=0;i--){
    const l=m.locations[i]; if(!passFilter(l)) continue;
    const [x,y]=toScreen(l.x,l.y);
    if((sx-x)**2+(sy-y)**2 <= r*r) return l;
  }
  return null;
}

/* ---------- Взаимодействие мышью ---------- */
let mouse={x:0,y:0}, drag=null, dragLoc=null;
wrap.addEventListener('mousedown', e=>{
  const sx=e.offsetX, sy=e.offsetY;
  const hit=pick(sx,sy);

  if(mode==='add'){
    const [wx,wy]=toWorld(sx,sy);
    if(wx<0||wx>1||wy<0||wy>1) return;
    const id='u'+Date.now();
    curr().locations.push({id,x:wx,y:wy,type:defaultType(currentLevel()),name:'Новая точка',desc:'',ruler:'',race:'',races:[],alignment:'',religion:''});
    save(); selectLoc(id); setMode(null); draw();
    return;
  }
  if(hit){
    dragLoc={ id:hit.id, sx, sy, moved:false };
    wrap.classList.add('dragging');
    return;
  }
  cancelCam();
  drag={sx,sy,vx:view.x,vy:view.y,moved:false};
  wrap.classList.add('dragging');
});
window.addEventListener('mousemove', e=>{
  const rect=wrap.getBoundingClientRect();
  mouse.x=e.clientX-rect.left; mouse.y=e.clientY-rect.top;
  if(dragLoc){
    if(Math.abs(mouse.x-dragLoc.sx)+Math.abs(mouse.y-dragLoc.sy)>3){ dragLoc.moved=true; cancelCam(); }
    if(dragLoc.moved){
      const l=locById(dragLoc.id);
      if(l){ let [wx,wy]=toWorld(mouse.x,mouse.y);
        l.x=Math.max(0,Math.min(1,wx)); l.y=Math.max(0,Math.min(1,wy)); draw(); }
    }
  } else if(drag){ const dx=mouse.x-drag.sx, dy=mouse.y-drag.sy;
    if(Math.abs(dx)+Math.abs(dy)>3){ drag.moved=true; }
    view.x=drag.vx+dx; view.y=drag.vy+dy; clampView(); draw();
  } else {
    // hover-подсветка
    const h=pick(mouse.x,mouse.y);
    const id=h?h.id:null;
    if(id!==hoverId){ hoverId=id; wrap.style.cursor=id?'pointer':''; draw(); }
  }
});
window.addEventListener('mouseup', ()=>{
  if(dragLoc){
    if(dragLoc.moved){ save(); }
    else { const l=locById(dragLoc.id); selectLoc(dragLoc.id); if(l) flyToLoc(l); } // клик по точке — полёт камеры + панель
  }
  // клик по пустому месту панель не открывает (инфо о карте — по крошке-названию сверху)
  drag=null; dragLoc=null; wrap.classList.remove('dragging');
});

wrap.addEventListener('dblclick', e=>{
  const hit=pick(e.offsetX,e.offsetY);
  if(hit && currentLevel()<3){ enterLocation(hit); }
});

wrap.addEventListener('wheel', e=>{
  e.preventDefault();
  const factor = e.deltaY<0 ? 1.15 : 1/1.15;
  zoomAt(e.offsetX, e.offsetY, factor);
}, {passive:false});

/* ---------- Сенсорное управление (мобильные устройства) ---------- */
let touchState=null, lastTap=0, tapTimer=null;
function relPt(t){ const r=wrap.getBoundingClientRect(); return { x:t.clientX-r.left, y:t.clientY-r.top }; }
function touchDist(a,b){ const dx=a.clientX-b.clientX, dy=a.clientY-b.clientY; return Math.hypot(dx,dy); }
function touchMid(a,b){ const r=wrap.getBoundingClientRect(); return { x:(a.clientX+b.clientX)/2-r.left, y:(a.clientY+b.clientY)/2-r.top }; }

wrap.addEventListener('touchstart', e=>{
  if(e.touches.length===1){
    const p=relPt(e.touches[0]);
    const hit=pick(p.x,p.y);
    if(mode==='add'){
      const [wx,wy]=toWorld(p.x,p.y);
      if(wx>=0&&wx<=1&&wy>=0&&wy<=1){ const id='u'+Date.now();
        curr().locations.push({id,x:wx,y:wy,type:defaultType(currentLevel()),name:'Новая точка',desc:'',ruler:'',race:'',races:[],alignment:'',religion:''});
        save(); selectLoc(id); setMode(null); draw(); }
      touchState=null; return;
    }
    if(hit){ touchState={mode:'loc', id:hit.id, sx:p.x, sy:p.y, moved:false}; }
    else { cancelCam(); touchState={mode:'pan', sx:p.x, sy:p.y, vx:view.x, vy:view.y, moved:false}; }
  } else if(e.touches.length===2){
    cancelCam();
    const d=touchDist(e.touches[0],e.touches[1]);
    const mid=touchMid(e.touches[0],e.touches[1]);
    touchState={mode:'pinch', startDist:d, startScale:view.scale, mid};
  }
}, {passive:false});

wrap.addEventListener('touchmove', e=>{
  if(!touchState) return;
  e.preventDefault();
  if(touchState.mode==='pinch' && e.touches.length===2){
    const d=touchDist(e.touches[0],e.touches[1]);
    const mid=touchMid(e.touches[0],e.touches[1]);
    const factor=(d/touchState.startDist) * (touchState.startScale/view.scale);
    zoomAt(mid.x, mid.y, factor);
  } else if(touchState.mode==='pan' && e.touches.length===1){
    const p=relPt(e.touches[0]);
    const dx=p.x-touchState.sx, dy=p.y-touchState.sy;
    if(Math.abs(dx)+Math.abs(dy)>4) touchState.moved=true;
    view.x=touchState.vx+dx; view.y=touchState.vy+dy; clampView(); draw();
  } else if(touchState.mode==='loc' && e.touches.length===1){
    const p=relPt(e.touches[0]);
    if(Math.abs(p.x-touchState.sx)+Math.abs(p.y-touchState.sy)>6){ touchState.moved=true; cancelCam();
      const l=locById(touchState.id);
      if(l){ let [wx,wy]=toWorld(p.x,p.y); l.x=Math.max(0,Math.min(1,wx)); l.y=Math.max(0,Math.min(1,wy)); draw(); } }
  }
}, {passive:false});

wrap.addEventListener('touchend', e=>{
  if(!touchState){ return; }
  if(touchState.mode==='loc' && !touchState.moved){
    const id=touchState.id; const l=locById(id);
    const now=Date.now();
    if(now-lastTap<320 && currentLevel()<3 && l){ // двойной тап — вход (если можно глубже)
      clearTimeout(tapTimer); lastTap=0; enterLocation(l);
    } else {
      lastTap=now;
      selectLoc(id); if(l) flyToLoc(l);
    }
  } else if(touchState.mode==='loc' && touchState.moved){
    save();
  }
  touchState=null;
}, {passive:false});

function zoomAt(sx,sy,factor){
  cancelCam();
  const [wx,wy]=toWorld(sx,sy);
  view.scale=Math.max(0.3,Math.min(12,view.scale*factor));
  // удержать точку карты под курсором
  const b=baseRect();
  const w=b.w*view.scale, h=b.h*view.scale;
  const ox=(W-w)/2, oy=(H-h)/2;
  view.x = sx - wx*w - ox;
  view.y = sy - wy*h - oy;
  clampView();
  draw();
}

// Ограничение смещения, чтобы карта не уезжала полностью за пределы экрана
function clampView(){
  const b=baseRect();
  const w=b.w*view.scale, h=b.h*view.scale;
  const baseOx=(W-w)/2, baseOy=(H-h)/2;
  const padX=W*0.25, padY=H*0.25;
  const minX = (W-padX) - (baseOx + w);
  const maxX = padX - baseOx;
  const minY = (H-padY) - (baseOy + h);
  const maxY = padY - baseOy;
  if(minX<=maxX) view.x=Math.max(minX,Math.min(maxX,view.x));
  if(minY<=maxY) view.y=Math.max(minY,Math.min(maxY,view.y));
}

/* ---------- Плавная камера («полёт» к точке, как в LoL) ---------- */
function cancelCam(){ camTarget=null; }

// Рассчитать view так, чтобы точка карты (lx,ly) оказалась в заданной точке экрана при масштабе scale
function viewFor(lx,ly, scale, screenX, screenY){
  const b=baseRect();
  const w=b.w*scale, h=b.h*scale;
  const baseOx=(W-w)/2, baseOy=(H-h)/2;
  return { x: screenX - lx*w - baseOx, y: screenY - ly*h - baseOy, scale };
}
// Полёт камеры к точке локации (учитывая, где находится панель)
function isMobile(){ return window.innerWidth <= 760; }
function flyToLoc(l, scale){
  cancelCam();
  const sc = scale!==undefined ? scale : Math.max(view.scale, 2.4);
  let targetX, targetY;
  if(isMobile()){
    // панель overlay справа (≤86vw). Целим точку в свободную полосу слева, по вертикали — центр
    const panelW = Math.min(window.innerWidth*0.86, 360);
    targetX = Math.max(W*0.28, (W - panelW) * 0.5);
    targetY = H*0.5;
  } else {
    // панель справа (400px): центр видимой области слева от неё
    targetX = (W - 400) * 0.5;
    targetY = H*0.5;
  }
  const tv = viewFor(l.x, l.y, sc, targetX, targetY);
  camTarget = tv; camAnim = true;
  requestAnimationFrame(tick);
}
function flyTo(targetView){
  cancelCam(); camTarget=targetView; camAnim=true; requestAnimationFrame(tick);
}

let lastT=0;
function tick(now){
  if(!camTarget){ camAnim=false; return; }
  // экспоненциальное сглаживание к цели
  const k = 0.16;
  view.x += (camTarget.x - view.x)*k;
  view.y += (camTarget.y - view.y)*k;
  view.scale += (camTarget.scale - view.scale)*k;
  const done = Math.abs(camTarget.x-view.x)<0.5 && Math.abs(camTarget.y-view.y)<0.5 && Math.abs(camTarget.scale-view.scale)<0.002;
  if(done){ view.x=camTarget.x; view.y=camTarget.y; view.scale=camTarget.scale; camTarget=null; camAnim=false; }
  draw();
  if(camTarget) requestAnimationFrame(tick);
}

/* непрерывная анимация пульсации свечения у выбранной/hover точки */
function glowLoop(){
  glowPhase += 0.05;
  if(selected || hoverId) draw();
  requestAnimationFrame(glowLoop);
}

/* ---------- Навигация по уровням ---------- */
function enterLocation(loc){
  if(currentLevel()>=3) return;          // глубже 3-го уровня не входим
  navStack.push(loc.id);
  currentMap=loc.id; selected=null; hoverId=null;
  if(!DATA.details[loc.id]) DATA.details[loc.id]={name:loc.name,desc:'',locations:[]};
  if(DATA.details[loc.id].desc===undefined) DATA.details[loc.id].desc='';
  clearFilters(); fmExpanded='types';
  refreshAspect();
  updateCrumb(); updateLevelUI();
  closePanel(); renderFilters();
  view={x:0,y:0,scale:2.2};
  flyTo({x:0,y:0,scale:1});
}
// На один уровень вверх
function goBack(){
  if(!navStack.length) return;
  navStack.pop();
  currentMap = navStack.length ? navStack[navStack.length-1] : 'world';
  selected=null; hoverId=null;
  clearFilters(); fmExpanded='types';
  refreshAspect();
  updateCrumb(); updateLevelUI();
  closePanel(); renderFilters();
  view={x:0,y:0,scale:1.6};
  flyTo({x:0,y:0,scale:1});
}
// Сразу к миру
function backToWorld(){
  navStack=[]; currentMap='world'; selected=null; hoverId=null;
  clearFilters(); fmExpanded='types';
  refreshAspect();
  updateCrumb(); updateLevelUI();
  closePanel(); renderFilters();
  view={x:0,y:0,scale:1.6};
  flyTo({x:0,y:0,scale:1});
}
// Показать/скрыть кнопку фильтров (на уровне 1 скрыта) и обновить подсказку добавления
function updateLevelUI(){
  // фильтры доступны на всех уровнях (кнопка всегда видна)
  document.getElementById('filter-btn').style.display = '';
}

/* ---------- Панель ---------- */
const panel=document.getElementById('panel');
function openPanel(){ panel.classList.remove('closed'); }
function closePanel(){ panel.classList.add('closed'); selected=null; panelMode=null; }

/* --- Панель точки --- */
function selectLoc(id){
  selected=id; panelMode='loc'; openPanel(); renderPanel();
}
// Заполнить hero-блок: картинка или красивая заглушка с инициалом
function setHero(imgUrl, initial){
  const hero=document.getElementById('p-hero');
  if(imgUrl){ hero.className='panel-hero'; hero.innerHTML='<img src="'+imgUrl+'"><div class="hero-fade"></div>'; }
  else { hero.className='panel-hero empty'; hero.innerHTML='<span>'+escapeHtml(initial||'◆')+'</span><div class="hero-fade"></div>'; }
}
function renderPanel(){
  const l=locById(selected); if(!l){ closePanel(); return; }
  const t=TYPES[l.type]||TYPES.village;
  const heroSrc = l.heroImg || (DATA.images[l.id] ? DATA.images[l.id] : null);
  setHero(heroSrc, (l.name||'◆').charAt(0).toUpperCase());
  document.getElementById('p-type').innerHTML='<span class="dot" style="background:'+t.color+'"></span>'+t.name;
  document.getElementById('p-name').textContent=l.name;
  const canEnter = currentLevel()<3;

  // блок атрибутов по схеме категории типа (на всех уровнях)
  const rows=[];
  const attrRow=(icon,label,val)=> rows.push(
    '<div class="attr"><div class="attr-ico">'+fieldSVG(icon)+'</div>'+
    '<div class="attr-text"><div class="attr-label">'+label+'</div><div class="attr-val">'+val+'</div></div></div>');
  fieldsFor(l.type).forEach(f=>{
    if(f.multi){
      const arr=Array.isArray(l[f.key])?l[f.key]:[];
      if(arr.length) attrRow(f.icon, f.label, arr.map(r=>'<span class="chip-r">'+escapeHtml(r)+'</span>').join(''));
    } else {
      const v=(l[f.key]||'').trim();
      if(v && v!=='—') attrRow(f.icon, f.label, escapeHtml(v));
    }
  });
  const attrs = rows.length ? '<div class="attrs">'+rows.join('')+'</div>' : '';

  // сводка по вложенным локациям (оглавление): если у точки есть детальная карта
  let inner='';
  if(canEnter){
    const d=DATA.details[l.id];
    const subs=(d && d.locations) ? d.locations : [];
    if(subs.length){
      const byType={};
      subs.forEach(s=>{ byType[s.type]=(byType[s.type]||0)+1; });
      const chips=Object.entries(byType).map(([tp,n])=>{
        const tv=TYPES[tp]||{name:tp,color:'#c8aa6e'};
        return '<span class="sub-chip"><span class="sub-ico" style="color:'+tv.color+'">'+typeSVG(tv.icon)+'</span>'+escapeHtml(tv.name)+' · '+n+'</span>';
      }).join('');
      inner='<div class="attr-label" style="margin:14px 0 8px">Внутри ('+subs.length+')</div><div class="sub-list">'+chips+'</div>';
    }
  }

  document.getElementById('p-body').innerHTML =
    attrs +
    '<p>'+ (l.desc? escapeHtml(l.desc).replace(/\n/g,'<br>') : '<i style="color:var(--parchment-dark)">Описания пока нет.</i>') +'</p>'+
    inner +
    (canEnter? '<span class="badge">Двойной клик по точке — войти внутрь</span>':'');
  const here=isPartyHere(l.id);
  document.getElementById('p-foot').innerHTML =
    (canEnter?'<div class="btn gold" id="b-enter">Войти ⤵</div>':'')+
    '<div class="btn'+(here?' party-on':'')+'" id="b-party">'+(here?'★ Партия здесь':'☆ Партия здесь')+'</div>'+
    '<div class="btn" id="b-edit">Править</div>';
  if(canEnter) document.getElementById('b-enter').onclick=()=>enterLocation(l);
  document.getElementById('b-party').onclick=()=>{
    if(isPartyHere(l.id)){ DATA.party=null; }
    else { DATA.party={ path:navStack.slice(), id:l.id }; }
    save(); renderPanel(); draw(); updatePartyBtn();
  };
  document.getElementById('b-edit').onclick=editPanel;
}
function editPanel(){
  const l=locById(selected); if(!l) return;
  const allowed = allowedTypes(currentLevel()).slice();
  if(!allowed.includes(l.type)) allowed.unshift(l.type);
  const opts=allowed.map(k=>{ const v=TYPES[k]||{name:k}; return '<option value="'+k+'"'+(k===l.type?' selected':'')+'>'+v.name+'</option>'; }).join('');
  document.getElementById('p-name').textContent='Редактирование';
  document.getElementById('p-type').innerHTML='<span class="dot" style="background:var(--cyan)"></span>Точка';

  // Сгенерировать HTML полей категории для заданного типа
  function attrsFormFor(type){
    return fieldsFor(type).map(f=>{
      if(f.multi){
        const arr=Array.isArray(l[f.key])?l[f.key]:[];
        const tags=arr.map((r,i)=>'<span class="race-tag">'+escapeHtml(r)+'<b data-k="'+f.key+'" data-i="'+i+'">×</b></span>').join('');
        return '<div class="field"><label>'+f.label+'</label>'+
          '<div class="races-edit" data-list="'+f.key+'">'+tags+'</div>'+
          '<div class="race-add"><input class="edit" data-newfor="'+f.key+'" placeholder="добавить…"><button type="button" data-addfor="'+f.key+'">+</button></div>'+
          '</div>';
      }
      return '<div class="field"><label>'+f.label+'</label><input class="edit" data-field="'+f.key+'" value="'+escapeHtml(l[f.key]||'')+'"></div>';
    }).join('');
  }

  document.getElementById('p-body').innerHTML=
    '<div class="field"><label>Название</label><input class="edit" id="e-name" value="'+escapeHtml(l.name)+'"></div>'+
    '<div class="field"><label>Картинка шапки</label>'+
      (l.heroImg?'<div class="map-preview" style="margin-bottom:8px"><img src="'+l.heroImg+'"></div>':'')+
      '<div class="btn" id="e-hero-btn" style="flex:none">'+(l.heroImg?'Заменить картинку':'Загрузить картинку')+'</div>'+
      (l.heroImg?'<div class="btn danger" id="e-hero-clear" style="flex:none;margin-top:6px">Убрать картинку</div>':'')+'</div>'+
    '<div class="field"><label>Тип</label><select id="e-type">'+opts+'</select></div>'+
    '<div class="field" id="e-region-wrap" style="display:none"><label>SVG-иконка региона</label>'+
      '<div class="btn" id="e-svg-btn" style="flex:none">'+(l.iconSvg?'Заменить SVG':'Загрузить SVG')+'</div>'+
      (l.iconSvg?'<div class="btn danger" id="e-svg-clear" style="flex:none;margin-top:6px">Убрать SVG</div>':'')+'</div>'+
    '<div id="e-attrs">'+attrsFormFor(l.type)+'</div>'+
    '<div class="field"><label>Описание</label><textarea id="e-desc">'+escapeHtml(l.desc||'')+'</textarea></div>';
  document.getElementById('p-foot').innerHTML=
    '<div class="btn gold" id="b-save">Сохранить</div>'+
    '<div class="btn danger" id="b-del">Удалить</div>';

  // Считать значения простых полей из формы в объект (чтобы не терять при пересборке)
  function readSimpleFields(){
    document.querySelectorAll('#e-attrs input[data-field]').forEach(inp=>{ l[inp.dataset.field]=inp.value.trim(); });
  }
  // Навесить обработчики на мульти-поля текущей схемы
  function bindMulti(){
    document.querySelectorAll('#e-attrs [data-addfor]').forEach(btn=>{
      const key=btn.dataset.addfor;
      const inp=document.querySelector('#e-attrs [data-newfor="'+key+'"]');
      const add=()=>{ const v=inp.value.trim(); if(v){ if(!Array.isArray(l[key]))l[key]=[]; l[key].push(v); readSimpleFields(); save(); rebuildAttrs(); } };
      btn.onclick=add;
      inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); }});
    });
    document.querySelectorAll('#e-attrs .race-tag b').forEach(b=>{ b.onclick=()=>{ const key=b.dataset.k; l[key].splice(+b.dataset.i,1); readSimpleFields(); save(); rebuildAttrs(); }; });
  }
  function rebuildAttrs(){
    document.getElementById('e-attrs').innerHTML=attrsFormFor(document.getElementById('e-type').value);
    bindMulti();
  }

  const typeSel=document.getElementById('e-type');
  const regionWrap=document.getElementById('e-region-wrap');
  const sync=()=>{ regionWrap.style.display = typeSel.value==='region' ? '' : 'none'; };
  typeSel.onchange=()=>{ readSimpleFields(); sync(); rebuildAttrs(); };
  sync(); bindMulti();

  // загрузка картинки шапки локации
  const heroBtn=document.getElementById('e-hero-btn');
  if(heroBtn) heroBtn.onclick=()=>{
    const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange=ev=>{ const f=ev.target.files[0]; if(!f) return;
      const rd=new FileReader(); rd.onload=()=>{ l.heroImg=rd.result; save(); editPanel(); }; rd.readAsDataURL(f); };
    inp.click();
  };
  const heroClear=document.getElementById('e-hero-clear');
  if(heroClear) heroClear.onclick=()=>{ delete l.heroImg; save(); editPanel(); };

  // загрузка SVG-иконки региона
  const svgBtn=document.getElementById('e-svg-btn');
  if(svgBtn) svgBtn.onclick=()=>{
    const inp=document.createElement('input'); inp.type='file'; inp.accept='.svg,image/svg+xml';
    inp.onchange=ev=>{ const f=ev.target.files[0]; if(!f) return;
      const rd=new FileReader(); rd.onload=()=>{ l.iconSvg=rd.result; delete iconImgCache['custom|'+l.id]; save(); editPanel(); draw(); }; rd.readAsDataURL(f); };
    inp.click();
  };
  const svgClear=document.getElementById('e-svg-clear');
  if(svgClear) svgClear.onclick=()=>{ delete l.iconSvg; save(); editPanel(); draw(); };

  document.getElementById('b-save').onclick=()=>{
    l.name=document.getElementById('e-name').value.trim()||'Без названия';
    l.type=document.getElementById('e-type').value;
    readSimpleFields();   // мульти-поля уже в объекте
    l.desc=document.getElementById('e-desc').value.trim();
    save(); renderFilters(); renderPanel(); draw();
  };
  document.getElementById('b-del').onclick=()=>{
    const m=curr();
    m.locations=m.locations.filter(x=>x.id!==l.id);
    if(isPartyHere(l.id)){ DATA.party=null; updatePartyBtn(); }
    save(); renderFilters(); closePanel(); draw();
  };
}

/* --- Панель карты (описание + картинка) --- */
function openMapPanel(){
  closeFilterMenu(); selected=null; panelMode='map'; openPanel(); renderMapPanel();
}
function renderMapPanel(){
  const m=curr();
  const isWorld = currentMap==='world';
  const hasImg = !!DATA.images[currentMap];
  setHero(hasImg?DATA.images[currentMap]:null, (m.name||(isWorld?'Мир':'◆')).charAt(0).toUpperCase());
  document.getElementById('p-type').innerHTML='<span class="dot" style="background:var(--cyan)"></span>'+(isWorld?'Карта мира':'Карта локации');
  document.getElementById('p-name').textContent=m.name||(isWorld?'Известный мир':'Локация');
  document.getElementById('p-body').innerHTML =
    '<p>'+ (m.desc? escapeHtml(m.desc).replace(/\n/g,'<br>') : '<i style="color:var(--parchment-dark)">Описания пока нет.</i>') +'</p>'+
    (hasImg?'':'<span class="badge">Картинка не загружена — показана сгенерированная карта</span>');
  document.getElementById('p-foot').innerHTML =
    '<div class="btn gold" id="b-upload">'+(hasImg?'Заменить':'Загрузить')+'</div>'+
    '<div class="btn" id="b-medit">Править</div>';
  document.getElementById('b-upload').onclick=()=>document.getElementById('mapfile').click();
  document.getElementById('b-medit').onclick=editMapPanel;
}
function editMapPanel(){
  const m=curr();
  const hasImg = !!DATA.images[currentMap];
  document.getElementById('p-name').textContent='Редактирование карты';
  document.getElementById('p-type').innerHTML='<span class="dot" style="background:var(--gold)"></span>Карта';
  document.getElementById('p-body').innerHTML=
    '<div class="field"><label>Название карты</label><input class="edit" id="m-name" value="'+escapeHtml(m.name||'')+'"></div>'+
    '<div class="field"><label>Описание</label><textarea id="m-desc">'+escapeHtml(m.desc||'')+'</textarea></div>'+
    (hasImg? '<div class="btn danger" id="m-clear" style="flex:none">Убрать картинку (вернуть заглушку)</div>':'');
  document.getElementById('p-foot').innerHTML=
    '<div class="btn gold" id="m-save">Сохранить</div>';
  document.getElementById('m-save').onclick=()=>{
    m.name=document.getElementById('m-name').value.trim();
    m.desc=document.getElementById('m-desc').value.trim();
    save(); renderMapPanel();
    updateCrumb();   // имя мира или локации в крошках
  };
  const clr=document.getElementById('m-clear');
  if(clr) clr.onclick=()=>{ delete DATA.images[currentMap]; delete imgCache[currentMap]; refreshAspect(); save(); draw(); renderMapPanel(); };
}
function isWorldNow(){ return currentMap==='world'; }

function escapeHtml(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- Фильтры (выпадающие группы) ---------- */
let filterOpen = false;
let fmExpanded = 'types';   // какая группа развёрнута

// Собрать уникальные значения поля по всем локациям текущей карты (учёт multi-полей)
function collectValues(field){
  const set=new Set();
  curr().locations.forEach(l=>{
    const val=l[field];
    if(Array.isArray(val)){ val.forEach(v=>{ v=(v||'').trim(); if(v&&v!=='—') set.add(v); }); }
    else { const v=(val||'').trim(); if(v && v!=='—') set.add(v); }
  });
  return [...set].sort((a,b)=>a.localeCompare(b,'ru'));
}

// Какие поля встречаются среди локаций текущей карты (по их типам) — для групп фильтров
function activeFieldGroups(){
  const seen=new Map();   // key -> label (с учётом иконки)
  curr().locations.forEach(l=>{
    fieldsFor(l.type).forEach(f=>{ if(!seen.has(f.key)) seen.set(f.key, f); });
  });
  return [...seen.values()];
}

function renderFilters(){
  const menu=document.getElementById('filter-menu');
  let groups=[{ key:'types', title:'Локации', isType:true }];
  // группы по полям, реально присутствующим у локаций текущей карты (на любом уровне)
  activeFieldGroups().forEach(f=>{ groups.push({ key:f.key, title:f.label, field:f.key }); });
  let html='<div class="fm-head"><span class="fm-title">Фильтры</span><div class="fm-close" id="fm-close">✕</div></div>';
  html+='<div class="fm-toggle-all" id="fm-reset">Сбросить все</div>';
  html+='<div class="fm-scroll">';

  groups.forEach(g=>{
    const sel=filterSet(g.key);
    const expanded = fmExpanded===g.key;
    const badge = sel.size ? '<span class="fm-gcount">'+sel.size+'</span>' : '';
    html+='<div class="fm-group">';
    html+='<div class="fm-gh" data-g="'+g.key+'"><span>'+g.title+'</span>'+badge+'<span class="fm-arrow">'+(expanded?'▾':'▸')+'</span></div>';
    if(expanded){
      html+='<div class="fm-glist">';
      if(g.isType){
        allowedTypes(currentLevel()).forEach(k=>{
          const v=TYPES[k]; if(!v) return;
          const on=sel.has(k);
          html+='<div class="fm-row '+(on?'on':'off')+'" data-cat="types" data-v="'+k+'">'+
            '<span class="fm-icon" style="color:'+v.color+'">'+typeSVG(v.icon)+'</span>'+
            '<span class="fm-label">'+v.name+'</span><span class="fm-check"></span></div>';
        });
      } else {
        const vals=collectValues(g.field);
        if(!vals.length){ html+='<div class="fm-empty">Нет данных — заполните в локациях</div>'; }
        vals.forEach(v=>{
          const on=sel.has(v);
          html+='<div class="fm-row '+(on?'on':'off')+'" data-cat="'+g.key+'" data-v="'+escapeHtml(v)+'">'+
            '<span class="fm-label">'+escapeHtml(v)+'</span><span class="fm-check"></span></div>';
        });
      }
      html+='</div>';
    }
    html+='</div>';
  });
  html+='</div>';   // .fm-scroll
  menu.innerHTML=html;

  document.getElementById('fm-close').onclick=closeFilterMenu;

  // развернуть/свернуть группу
  menu.querySelectorAll('.fm-gh').forEach(gh=>{
    gh.onclick=()=>{ const k=gh.dataset.g; fmExpanded = (fmExpanded===k)?null:k; renderFilters(); };
  });
  // выбор значения
  menu.querySelectorAll('.fm-row').forEach(row=>{
    row.onclick=()=>{
      const cat=row.dataset.cat, v=row.dataset.v;
      const set=filterSet(cat);
      set.has(v)?set.delete(v):set.add(v);
      renderFilters(); updateFilterBtn(); draw();
    };
  });
  document.getElementById('fm-reset').onclick=()=>{
    clearFilters();
    renderFilters(); updateFilterBtn(); draw();
  };
  const back=document.getElementById('back-world');
  if(back) back.style.display = (currentLevel()>1) ? '' : 'none';
  updateFilterBtn();
}
function updateFilterBtn(){
  let n=0; Object.values(filters).forEach(s=>n+=s.size);
  const btn=document.getElementById('filter-btn');
  const cnt=document.getElementById('filter-count');
  if(n>0){ btn.classList.add('has-active'); cnt.style.display=''; cnt.textContent=n; }
  else { btn.classList.remove('has-active'); cnt.style.display='none'; }
}
function openFilterMenu(){ document.getElementById('filter-menu').classList.remove('hidden'); filterOpen=true; renderFilters(); }
function closeFilterMenu(){ document.getElementById('filter-menu').classList.add('hidden'); filterOpen=false; }
document.getElementById('filter-btn').onclick=(e)=>{ e.stopPropagation(); filterOpen?closeFilterMenu():openFilterMenu(); };
document.addEventListener('click',(e)=>{
  if(filterOpen && !e.target.closest('#filter-menu') && !e.target.closest('#filter-btn')) closeFilterMenu();
});

/* ---------- Режимы (добавить / дорога) ---------- */
function setMode(m){
  mode=m;
  document.getElementById('addmode').classList.toggle('active', m==='add');
  const hint=document.getElementById('hint');
  if(m==='add') hint.textContent='Кликните на карту, чтобы поставить новый маркер';
  else hint.textContent='Клик по точке — описание · Название сверху — о карте · Колесо — зум · 2× клик — войти';
}

/* ---------- Контролы ---------- */
document.getElementById('zoomin').onclick=()=>zoomAt(W/2,H/2,1.3);
document.getElementById('zoomout').onclick=()=>zoomAt(W/2,H/2,1/1.3);
document.getElementById('recenter').onclick=()=>{ flyTo({x:0,y:0,scale:1}); };
document.getElementById('addmode').onclick=()=>setMode(mode==='add'?null:'add');
document.getElementById('goparty').onclick=goToParty;

// Показать/скрыть кнопку «К партии» (видна, если метка где-то стоит)
function updatePartyBtn(){
  document.getElementById('goparty').style.display = DATA.party ? '' : 'none';
}
// Перейти к карте, где стоит метка партии, и навести камеру на точку
function goToParty(){
  if(!DATA.party) return;
  const path=DATA.party.path||[];
  // перестроить навигацию по сохранённому пути
  navStack = path.slice();
  currentMap = navStack.length ? navStack[navStack.length-1] : 'world';
  clearFilters(); fmExpanded='types';
  refreshAspect(); updateCrumb(); updateLevelUI(); closeFilterMenu();
  const l=locById(DATA.party.id);
  if(l){ selectLoc(DATA.party.id); flyToLoc(l, Math.max(2.4, view.scale)); }
  else { // точка пропала (удалена) — снимаем метку
    DATA.party=null; save(); updatePartyBtn(); flyTo({x:0,y:0,scale:1});
  }
  draw();
}
document.getElementById('search').addEventListener('input',e=>{ searchQ=e.target.value.toLowerCase().trim(); draw(); });
document.getElementById('panel-close').onclick=closePanel;
document.getElementById('back-world').onclick=goBack;

/* ---------- Редактируемое название мира ---------- */
const titleEl=document.getElementById('world-title');
titleEl.textContent = DATA.title || 'ATLAS';
titleEl.onclick=()=>{
  const inp=document.createElement('input');
  inp.id='title-input'; inp.value=DATA.title||'';
  inp.maxLength=60;
  titleEl.replaceWith(inp); inp.focus(); inp.select();
  const commit=()=>{
    const v=inp.value.trim()||'ATLAS';
    DATA.title=v; save();
    titleEl.textContent=v; inp.replaceWith(titleEl);
  };
  inp.addEventListener('keydown',ev=>{
    if(ev.key==='Enter') commit();
    if(ev.key==='Escape'){ inp.replaceWith(titleEl); }
  });
  inp.addEventListener('blur', commit);
};

// Скрытый input файла используется панелью карты (см. renderMapPanel)
document.getElementById('mapfile').addEventListener('change', e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    DATA.images[currentMap]=ev.target.result;   // data-URL
    delete imgCache[currentMap];                  // сбросить кэш
    view={x:0,y:0,scale:1};                        // показать новую карту целиком
    refreshAspect();                               // аспект уточнится в onload картинки
    save(); draw(); if(panelMode==='map') renderMapPanel();
  };
  reader.readAsDataURL(file);
  e.target.value='';
});

/* ---------- Старт ---------- */
renderFilters();
updateCrumb();
updateLevelUI();
updatePartyBtn();
resize();
refreshAspect();
draw();
glowLoop();
</script>
</body>
</html>
